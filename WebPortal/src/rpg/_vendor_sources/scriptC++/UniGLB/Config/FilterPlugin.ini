; UniGLB - packaging filter for `RunUAT BuildPlugin`.
;
; Binaries/ and Intermediate/ are regenerated by the build and must NOT be shipped in a code plugin;
; they are excluded automatically by BuildPlugin. This file lists the extra (non-Source/Config/
; Resources/Content/Shaders) files that DO need to travel with the packaged plugin.
[FilterPlugin]
/ThirdParty/assimp/include/...
/ThirdParty/assimp/lib/x64/Release/assimp-vc141-mt.lib
/ThirdParty/assimp/bin/x64/assimp-vc141-mt.dll
/ThirdParty/assimp/LICENSE
/ThirdParty/assimp/README_ORIGIN.md
/ThirdParty/rapidjson/include/...
/ThirdParty/rapidjson/license.txt
/ThirdParty/vrm_specification/...
/docs/...
/LICENSE
/CHANGELOG.md
