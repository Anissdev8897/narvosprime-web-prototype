# Configuration Electron Builder pour NARVOS PRIME
# Ce fichier est optionnel si la config est dans package.json

appId: com.narvosprime.app
productName: NARVOS PRIME
copyright: Copyright © 2025 NARVOS PRIME Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"
  - "!src/**/*"
  - "!public/**/*"
  - "!.git/**/*"
  - "!*.md"
  - "!.cursor/**/*"

asar: true
asarUnpack:
  - "**/*.node"       # Déballe les modules natifs (better-sqlite3)
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"

# Compression maximale de l'asar (gain -15% taille)
compression: maximum

# Supprimer les scripts npm des artefacts finaux
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Game

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh

