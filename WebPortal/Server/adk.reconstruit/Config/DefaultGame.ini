; ══════════════════════════════════════════════════════════════════════════════
; Ce que le cook NE DOIT PAS toucher — ajouté le 2026-09-06 après un crash.
;
; ── LE DÉFAUT ────────────────────────────────────────────────────────────────
; Le commandlet de cook ne se limite pas au dossier que le pack déclare : il
; ramasse TOUT ce qui est sous Content/. Mesuré : 89 713 paquets, dont 18 Go de
; packs simplement STAGÉS — importés pour en tirer des pièces, jamais promus
; sous Narvos/, et donc jamais montés dans le pack nanos
; (`Assets.toml` : unreal_folders = ["Narvos"]).
;
; Les cuire était déjà du gaspillage. C'était surtout FATAL :
;
;     Metahuman_Customization_System/Demo_Content/…/MotionMatchingData/…
;     Assertion failed: !Hash.IsZero()
;     Runtime/Engine/Private/Animation/AnimSequence.cpp:2151
;
; C'est le mode d'échec d'une AnimSequence SANS SQUELETTE — le même qui avait
; fait désactiver UniGLB. Le cook meurt à 625 paquets sur 89 713, et ne produit
; RIEN : le dossier Saved/Cooked/ n'existe même pas ensuite.
;
; Le même pack donnait aussi, juste avant :
;     Couldn't save package, filename is too long (261 >= 260)
; — la limite de chemin de Windows, atteinte par ses noms d'assets.
;
; ⚠ SI UN ASSET PROMU SOUS Narvos/ RÉFÉRENCE ENCORE UN DE CES DOSSIERS, sa
; référence sera morte à l'exécution, EN SILENCE. C'est le compromis assumé :
; `narvos-verifier-catalogues.mjs` est là pour l'attraper. Le contrôle après
; cook n'est pas optionnel.
[/Script/UnrealEd.ProjectPackagingSettings]
