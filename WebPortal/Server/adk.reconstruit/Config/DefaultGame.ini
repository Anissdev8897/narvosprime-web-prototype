; ── 4e passe, 2026-09-06 nuit : mon critere de balayage etait INCOMPLET ──────
;
; Le cook est mort une 4e fois, plus loin (63 150 sur 78 934), sur :
;
;   Zero key hash compressed animation data for M_Neutral_AO_Crouch_X...
;   Assertion failed: !Hash.IsZero()
;
; ⚠ CE COUPABLE AVAIT ETE EXAMINE PAR `adk-animations-sans-squelette.py` ET JUGE
; SAIN : son squelette resout. « Squelette nul » n'est donc qu'UNE des causes de
; cette assertion, pas la seule. Les `AO_` sont des animations ADDITIVES : une
; additive peut avoir un squelette valide et des donnees compressees vides.
;
; Le script reste utile — il a trouve 1 925 animations reellement cassees — mais
; il ne faut PAS le croire exhaustif. Tant qu'un cook n'est pas alle au bout, la
; liste des tueuses n'est pas close.
;
; ── CE QU'ON EXCLUT MAINTENANT, ET POURQUOI ────────────────────────────────────
; Les 6 packs dont le balayage a prouve que des animations ont un squelette nul,
; PLUS le dossier du 4e coupable. Une animation cassee ne joue de toute facon
; pas : les ecarter ne perd rien qui fonctionne, et debloque le cook.
;
;   NARVOS_Retarget  1 418 cassees   (notre propre sortie de retargeting)
;   Defender           238
;   SmartLocomotion    124           (deja exclu plus haut, garde pour memoire)
;   MetaHumans          92
;   CoreC               39
;   Shared              14
;   Locomotion/AimOffset  42 animations additives — le tueur de cette passe
;
; ⚠ `Locomotion/` N'EST PAS EXCLU EN ENTIER : ses 1 332 autres animations
; (Walk 348, Run 346, Crouch 215, Jump 142...) sont la locomotion qu'on veut.
; Seul `AimOffset` part.
