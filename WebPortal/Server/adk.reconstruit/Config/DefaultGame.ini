; ── Vague 10 (2026-09-08) — FluidFlux abandonne, DECISION DU PROJET
;
; Ce n'est pas un plantage : le cook du 08/09 n'a leve AUCUNE assertion. C'est
; un cout. Mesure faite sur ce cook precis, journal a l'appui :
;
;   77 272 paquets sur 77 373 cuits en ~4 h
;   les 101 restants = les materiaux d'eau de FluidFlux
;   rythme observe : 21 paquets en 2 h 09, soit ~6 min/paquet
;   extrapolation : 10 h de plus, pour 0,13 % des paquets
;
; Pourquoi si cher : simulation de fluide (caustiques, SDF, profils de vagues,
; integration de velocite) MULTIPLIEE par Substrate (le systeme de materiaux
; de 5.7, qui double les permutations) et par le path tracing. Un seul de ces
; materiaux compile TBasePassPS, Lumen, PathTracingMaterialCHS_AHS, la passe
; d'ombre et la passe de velocite, pour chaque type de maillage.
;
; Jobs mesures a 155 s, 177 s, 210 s, 234 s — pour UN shader.
;
; Ce qu'on perd : rien qui tourne aujourd'hui. FluidFlux n'a JAMAIS ete vu en
; jeu ; on savait seulement que 68 de ses 69 blueprints compilent. L'eau du
; projet peut se faire avec le plugin Water natif, qui est dans la whitelist
; nanos et dont les materiaux sont deja cuits par le pack de base.
;
; Les deux chemins sont necessaires : le pack a ete promu sous Narvos/, mais
; 233 fichiers (redirecteurs) sont restes a la racine de Content/.
+DirectoriesToNeverCook=(Path="FluidFlux")
+DirectoriesToNeverCook=(Path="Narvos/FluidFlux")

