; ── Materiaux glTF d'Interchange DANS NOTRE PACK (2026-09-13) ───────────────────
; VU EN JEU le 2026-09-13 : la Forge entiere au DAMIER (WorldGridMaterial) a l'ecran
; de selection. Mesure : 13 304 instances cuites (Forge 12 965, Tour, Orbital…) ont
; pour parent /InterchangeAssets/gltf/MaterialInstances/MI_Default_Opaque_DS, du
; contenu de PLUGIN MOTEUR — hors Narvos/, donc hors pack. Le client nanos a bien sa
; propre copie cuite (Engine/Plugins/Interchange/…), mais c'est la version D'ORIGINE :
; notre M_Default.uasset est le SEUL fichier du moteur modifie depuis l'installation
; (2026-09-05 14:49), et notre M_Default cuit pese 784 Ko contre 347 Ko chez le
; client — d'autres usages, d'autres shaders. A l'execution, une instance consulte les
; usages de SON materiau de base : celui du client, qui ne les a pas -> materiau par
; defaut, le damier. Le controle d'imports ne regardait que /Game/ et n'a rien vu.
; Correctif : Content/Narvos/Interchange = COPIE (8,4 Mo, 203 fichiers, octet pour
; octet) du contenu du plugin ; les instances pointent desormais NOTRE chaine, cuite
; avec elles.
;
; ⚠ LE DOSSIER NE S'APPELLE PAS « InterchangeAssets », ET C'EST VOULU. Premier essai,
; meme matin : NewName="/Game/Narvos/InterchangeAssets/". Avec MatchSubstring, la
; CIBLE contenait la SOURCE : le cooker a reapplique le redirect a son propre resultat
; et 13 304 instances Forge ont dependu de /Game/Narvos/Game/Narvos/InterchangeAssets/
; ... — un paquet qui n'existe pas (« has a dependency on package ... which does not
; exist », 50 999 lignes). Cook arrete a 36 447/88 861, pack non reecrit.
; Regle : pour un redirect par sous-chaine, NewName ne doit JAMAIS contenir OldName
; (cf. MWLandscapeAutoMaterial plus haut). Garde :
; scripts/lua-harness/redirects-idempotents-check.mjs.
+PackageRedirects=(OldName="/InterchangeAssets/",NewName="/Game/Narvos/Interchange/",MatchSubstring=true)

