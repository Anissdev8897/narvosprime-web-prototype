; ── MWLandscapeAutoMaterial : le pack a été déplacé sous Narvos/ ───────────────
;
; 78 des 97 assets du pack référencent encore `/Game/MWLandscapeAutoMaterial/`,
; le chemin qu'ils avaient AVANT d'être rangés sous `/Game/Narvos/` (obligatoire :
; `Assets.toml` déclare `unreal_folders = ["Narvos"]`, rien hors de Narvos/ n'est
; cuit). Un `.uasset` porte son chemin de package EN DUR ; le déplacement a laissé
; ces références sans cible.
;
; Symptôme, et il ne ressemble pas à sa cause :
;   Failed to compile Material for platform PCD3D_SM6, Default Material will be
;   used in game.  Missing Material Function
;   (Node MakeMaterialAttributes) Error on property BaseColor
; Le matériau ne compile pas -> Unreal affiche le matériau PAR DÉFAUT, qui est
; GRIS. Les textures, elles, étaient parfaites (32 Texture2D 4096², 12 surcharges
; par instance, 0 vide) — d'où une chasse au mauvais coupable.
;
; Ce redirect remappe TOUT le sous-arbre en une ligne, sans toucher aux assets.
; ⚠ Le `/` final compte : `/Game/Narvos/MWLandscapeAutoMaterial/` ne contient pas
; la chaîne `/Game/MWLandscapeAutoMaterial/`, donc pas de remap récursif.
; ⚠ Les CoreRedirects sont lus AU DÉMARRAGE du moteur : il faut relancer l'éditeur.
[CoreRedirects]
+PackageRedirects=(OldName="/Game/MWLandscapeAutoMaterial/",NewName="/Game/Narvos/MWLandscapeAutoMaterial/",MatchSubstring=true)
+PackageRedirects=(OldName="/Game/SpaceScenes/",NewName="/Game/Narvos/SpaceScenes/",MatchSubstring=true)
