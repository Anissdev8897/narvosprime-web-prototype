;     which does not exist  ->  (Node TextureSample) Missing input texture
;     ->  Failed to compile Material, Default Material will be used in game
; Mesure : 79 des 103 materiaux du pack dans ce cas. Le four et l alambic
; seraient sortis gris. Cette redirection recolle tout au chargement, sans
; toucher un seul asset.
+PackageRedirects=(OldName="/Game/CraftingStations/",NewName="/Game/Narvos/CraftingStations/",MatchSubstring=true)

