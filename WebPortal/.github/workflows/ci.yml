# ═══════════════════════════════════════════════════════════════════════════════
# CI — NARVOS PRIME WebPortal
# Déclenché sur push (main, develop) et toute PR vers main/develop.
#
# Étages:
#   1. typecheck   → tsc --noEmit
#   2. tests       → vitest run
#   3. benchmarks  → vitest run (benchmark files uniquement)
#   4. build       → tsc && vite build
#   5. wasm        → compilation Emscripten (C++ → .wasm/.js)
#
# Cache: node_modules (npm), wasm/dist (Emscripten)
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── Paramètres globaux ──────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ───────── typecheck ─────────
  typecheck:
    name: 🔍 TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Installer les dépendances (sans scripts natifs)
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: 🔍 Typecheck
        run: npm run typecheck

  # ───────── tests ─────────
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Installer les dépendances (sans scripts natifs)
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: 🧪 Lancer les tests unitaires
        run: npm test

  # ───────── benchmarks ─────────
  benchmarks:
    name: ⏱ Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Installer les dépendances (sans scripts natifs)
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: ⏱ Lancer les benchmarks
        run: npx vitest run --config vitest.bench.config.ts --reporter=verbose
        env:
          CI: true

  # ───────── build (web) ─────────
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Installer les dépendances (sans scripts natifs)
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: 📦 Build web (tsc + vite)
        run: npm run build

      - name: 📦 Archiver le build (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          if-no-files-found: error

  # ───────── wasm (C++ → Emscripten) ─────────
  wasm:
    name: ⚙️ WASM (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 🔧 Installer Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.73

      - name: 🔍 Vérifier Emscripten
        run: |
          emcc --version
          emcmake --version

      - name: 📦 Installer les dépendances npm
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: ⚙️ Cache wasm/dist
        uses: actions/cache@v4
        with:
          path: wasm/dist
          key: wasm-${{ runner.os }}-${{ hashFiles('wasm/CMakeLists.txt', 'wasm/src/**/*.cpp', 'wasm/src/**/*.h') }}
          restore-keys: |
            wasm-${{ runner.os }}-

      - name: ⚙️ Compiler le WASM
        run: npm run build:wasm

      - name: 📋 Copier wasm → public/wasm
        run: npm run copy:wasm

      - name: 📦 Archiver le WASM (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: public/wasm/
          if-no-files-found: warn